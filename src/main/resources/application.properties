spring.application.name=autodrive-motors
server.port=8080

# ===== MySQL =====
# Crea la base antes de arrancar:  CREATE DATABASE autodrive_db;
# (o deja createDatabaseIfNotExist=true y que se cree sola)
spring.datasource.url=jdbc:mysql://localhost:3306/autodrive_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JSON =====
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Bogota

# ===== API externa de tasas de cambio =====
# API pública y gratuita, no requiere API key
exchange.api.url=https://open.er-api.com/v6/latest/COP
exchange.api.timeout-ms=5000

# ===== Reglas de negocio =====
venta.umbral-descuento=100000000
venta.porcentaje-descuento=5
