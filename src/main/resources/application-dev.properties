# Perfil "dev": base de datos H2 en memoria, para probar sin instalar MySQL.
# Arranca con:  mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Consola H2:   http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:autodrive_db)
spring.datasource.url=jdbc:h2:mem:autodrive_db;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
